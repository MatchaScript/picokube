# greenboot-set-rollback-trigger.service records the staged deployment's
# id in the GRUB environment from its ExecStop, so that greenboot can
# roll back to it once boot_counter is exhausted. The unit as shipped in
# greenboot 0.16 has DefaultDependencies=no and no Conflicts= or Before=
# against any shutdown target, so no stop job is queued for it on reboot
# and ExecStop never runs: next_deployment_id stays unset and greenboot
# ends a RED boot with "manual intervention required" instead of rolling
# back. ostree-finalize-staged.service, which this unit is ordered
# after, carries exactly these two lines; adding them here puts the
# stop job into the shutdown transaction, ordered before the finalize
# while bootc still reports the deployment as staged.
[Unit]
Conflicts=final.target
Before=final.target
