# greenboot's required check judges the live control plane, so it must
# not run before picokube.service has finished starting. After= is
# satisfied whether the unit reached READY=1 or failed, so a broken boot
# still goes RED and rolls back. On a node where picokube.service is not
# enabled the unit is not in the transaction and this ordering is a no-op.
[Unit]
After=picokube.service
