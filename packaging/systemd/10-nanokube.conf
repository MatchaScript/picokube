# crio.service is not enabled in the image; Upholds= lets multi-user.target
# start it without an enablement symlink.
#
# kubelet.service is deliberately NOT upheld: nanokube starts it itself (init
# and boot both `systemctl start kubelet.service`), and `nanokube reset` stops
# it so static pods do not come back mid-cleanup. An Upholds= on kubelet would
# undo that stop and restart kubelet against half-wiped state — see the
# invariant recorded in packaging/systemd/kubelet.service.
[Unit]
Upholds=crio.service
