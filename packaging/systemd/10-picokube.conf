# crio.service is not enabled in the image; Upholds= lets multi-user.target
# start it without an enablement symlink.
#
# kubelet.service is deliberately NOT upheld. It comes from the pkgs.k8s.io
# rpm and does carry an [Install] section, but the image never enables it:
# picokube starts kubelet itself (init and boot both `systemctl start
# kubelet.service`), and `picokube reset` stops it so static pods do not come
# back mid-cleanup. An Upholds= on kubelet would undo that stop and restart
# kubelet against half-wiped state.
[Unit]
Upholds=crio.service
