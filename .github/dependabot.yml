version: 2
updates:
  - package-ecosystem: "gomod"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "go"
    # picokube embeds kubeadm and is pinned to one Kubernetes minor per
    # release branch; the minor moves by hand (go.mod, version.go, the
    # image's KUBE_MINOR), never through Dependabot.
    ignore:
      - dependency-name: "k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
      - dependency-name: "sigs.k8s.io/*"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      k8s:
        patterns:
          - "k8s.io/*"
          - "sigs.k8s.io/*"
      go-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
      - "github-actions"
    groups:
      actions-minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directory: "/packaging"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Asia/Tokyo"
    labels:
      - "dependencies"
      - "docker"
    # The Go toolchain image tracks go.mod's go directive, which the
    # Kubernetes minor bump sets; only its patch level may move on its own.
    ignore:
      - dependency-name: "golang"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    groups:
      images:
        patterns:
          - "*"
